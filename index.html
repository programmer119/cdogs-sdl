<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width" />
	<title>SANG SUB</title>
	<style>
		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			background: #111;
			color: #ddd;
			font-family: system-ui, sans-serif;
			overflow: hidden;
		}

		#canvas {
			display: block;
			width: 100vw;
			height: 100vh;
			background: #000;
			outline: none;
		}

		#status {
			position: fixed;
			left: 12px;
			bottom: 12px;
			padding: 6px 8px;
			background: rgba(0, 0, 0, 0.7);
			border-radius: 4px;
			font-size: 13px;
			pointer-events: none;
		}
	</style>
</head>
<body>
	<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
	<div id="status">Loading...</div>
	<script>
		var Module = {
			canvas: document.getElementById("canvas"),
			print: function(text) {
				console.log(text);
			},
			printErr: function(text) {
				console.error(text);
			},
			setStatus: function(text) {
				var status = document.getElementById("status");
				if (status) {
					status.textContent = text;
					status.style.display = text ? "block" : "none";
				}
			}
		};
		window.addEventListener("error", function(event) {
			Module.setStatus(event.message);
		});
		window.addEventListener("unhandledrejection", function(event) {
			Module.setStatus(event.reason && event.reason.message ? event.reason.message : String(event.reason));
		});
	</script>
	<script src="index.js"></script>
</body>
</html>
